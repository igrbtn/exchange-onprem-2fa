global
    log /dev/log local0
    maxconn 4096
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 2m
    timeout server 2m

# SSL bridging: terminate TLS here with the CA-issued multi-SAN cert, re-encrypt to backends.
# L7/http mode enables the Coraza WAF and per-host routing.
frontend fe_https
    bind *:443 ssl crt /etc/haproxy/certs/lab.pem
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443

    # AD FS has no /common/sso/* endpoint (an Azure-AD path the MSAL/WAM broker navigates to
    # after auth). The broker reads the auth code from the URL, so return a blank 200 instead
    # of AD FS's IIS 404, which otherwise flashes in the Outlook popup.
    http-request return status 200 content-type "text/html" string "<!doctype html><title>ok</title>" if { hdr(host) -i sts.corp.example } { path_beg /common/sso/ }

    # Coraza WAF (SPOE). Buffer the request body so the agent can inspect it. Messages in
    # coraza.cfg are scoped to /owa /ecp only (binary rich-client protocols are NOT inspected).
    # The agent runs DetectionOnly, so action stays "allow" and the deny rules never fire until
    # the engine is set to On.
    option http-buffer-request
    filter spoe engine coraza config /etc/haproxy/coraza.cfg
    http-request  deny deny_status 403 hdr waf-block request if { var(txn.coraza.action) -m str deny }
    http-response deny deny_status 403 if { var(txn.coraza.action) -m str deny }

    acl h_sts hdr(host) -i sts.corp.example
    acl h_kc  hdr(host) -i kc.corp.example
    use_backend be_adfs if h_sts
    use_backend be_kc   if h_kc
    default_backend be_exchange

backend be_exchange
    server exch 10.0.0.20:443 ssl verify none sni str(mail.corp.example) check check-ssl check-sni mail.corp.example

backend be_adfs
    server adfs 10.0.0.10:443 ssl verify none sni str(sts.corp.example) check check-ssl check-sni sts.corp.example

backend be_kc
    http-request set-header X-Forwarded-Host kc.corp.example
    server kc 10.0.0.10:8080 check

# Coraza WAF SPOA agent (Docker, 127.0.0.1:9001). fail-open via set-on-error in coraza.cfg.
backend coraza-spoa
    mode tcp
    option spop-check
    server coraza1 127.0.0.1:9001 check inter 5s fall 3 rise 2

listen stats
    bind *:9000
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
