# =============================================================================
# HAProxy reference config - Exchange + AD FS + Keycloak
# SSL bridging (terminate TLS here, re-encrypt to backends) + Coraza WAF.
#
# Placeholders to replace for your environment:
#   corp.example                       - your AD DNS domain
#   mail/autodiscover/sts/kc.corp.example - service FQDNs (SAN on the HAProxy cert)
#   10.0.0.30                          - HAProxy frontend bind IP
#   10.0.0.20 / 10.0.0.10              - Exchange / AD FS + Keycloak backend IPs
#   10.0.0.0/24 , 10.0.9.0/24          - trusted / management networks
#   CHANGE_ME_*                        - secrets: set out-of-band, never commit
#
# See docs/04-haproxy-ssl-bridging.md. ASCII only.
# =============================================================================

global
    log /dev/log local0 info
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 20000

    ca-base  /etc/haproxy/certs
    crt-base /etc/haproxy/certs
    tune.ssl.default-dh-param 2048

    # Client-facing TLS: TLS1.2+ only, strong ciphers.
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 prefer-client-ciphers no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option redispatch
    retries 3
    # Long client/server timeouts are REQUIRED by Exchange long-polling
    # (ActiveSync heartbeat up to ~30 min, MAPI/EWS hanging GET). Do not shorten.
    timeout http-request     10s
    timeout http-keep-alive  10s
    timeout queue            30s
    timeout connect          10s
    timeout client           1000s
    timeout server           1000s
    timeout tunnel           3600s
    timeout client-fin       10s

# -----------------------------------------------------------------------------
# Stats - bound to localhost only. Reach it via an SSH tunnel, never the network.
# Set the password out-of-band (CHANGE_ME). Do not expose on 0.0.0.0.
# -----------------------------------------------------------------------------
listen stats
    bind 127.0.0.1:9000
    mode http
    stats enable
    stats uri /
    stats refresh 10s
    stats hide-version
    stats realm HAProxy\ Stats
    stats auth admin:CHANGE_ME_STRONG_PASSWORD

# =============================================================================
# HTTPS frontend: host-based routing to Exchange / AD FS / Keycloak.
# =============================================================================
frontend fe_https
    bind 10.0.0.30:80
    bind 10.0.0.30:443 ssl crt /etc/haproxy/certs/lab.pem alpn h2,http/1.1

    # Force HTTPS.
    http-request redirect scheme https code 301 if !{ ssl_fc }

    # Strip client-supplied forwarding headers BEFORE setting our own, so a client
    # cannot spoof source IP / scheme in logs or to the backends.
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Real-Ip
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443
    http-request set-header X-Real-Ip %[src]
    option forwardfor
    option http-keep-alive

    # Response security headers.
    http-response set-header X-Frame-Options SAMEORIGIN
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Referrer-Policy strict-origin-when-cross-origin
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-XSS-Protection 0

    # Block dangerous HTTP methods.
    http-request deny deny_status 405 if { method TRACE TRACK CONNECT }

    # AD FS has no /common/sso/* endpoint (an Azure-AD path the MSAL/WAM broker
    # navigates to after auth). The broker reads the auth code from the URL, so
    # return a blank 200 instead of AD FS's IIS 404, which flashes in the popup.
    http-request return status 200 content-type "text/html" string "<!doctype html><title>ok</title>" if { hdr(host) -i sts.corp.example } { path_beg /common/sso/ }

    # Coraza WAF (SPOE). Buffer the request body so the agent can inspect it.
    # Messages in coraza.cfg are scoped to /owa /ecp only (binary rich-client
    # protocols are NOT inspected). DetectionOnly by default, so these denies do
    # not fire until the engine is flipped to On.
    # NOTE: option http-buffer-request applies to the WHOLE frontend, so it also
    # buffers MAPI/EAS request bodies. Fine for a lab / moderate load. For large
    # deployments, split OWA/ECP into a dedicated frontend and buffer only there.
    option http-buffer-request
    filter spoe engine coraza config /etc/haproxy/coraza.cfg
    http-request  deny deny_status 403 hdr waf-block request if { var(txn.coraza.action) -m str deny }
    http-response deny deny_status 403 if { var(txn.coraza.action) -m str deny }

    # Trusted / management source networks.
    acl trust_net src 10.0.0.0/24
    acl mgmt_net  src 10.0.9.0/24

    # Host ACLs.
    acl h_exch hdr(host) -i mail.corp.example autodiscover.corp.example
    acl h_sts  hdr(host) -i sts.corp.example
    acl h_kc   hdr(host) -i kc.corp.example

    # Exchange periphery path ACLs.
    acl ecp        path_beg -i /ecp
    acl powershell path_beg -i /powershell

    # Brute-force / rate limiting on AUTH paths only. Login is 1-3 requests;
    # 20/10s stops credential-stuffing while leaving slack for retries/assets.
    # Never rate-limit ActiveSync/MAPI - they generate many legit requests.
    stick-table type ip size 100k expire 10m store http_req_rate(10s)
    acl auth_path path_beg -i /owa/auth /adfs/ls /realms
    http-request track-sc0 src if auth_path
    http-request deny deny_status 429 if auth_path { sc_http_req_rate(0) gt 20 }

    # ECP (Exchange Admin Center) + PowerShell remoting: management network only.
    # PowerShell vdir is a common RCE/EoP entry point; ECP is admin surface.
    http-request deny deny_status 403 if h_exch ecp        !mgmt_net
    http-request deny deny_status 403 if h_exch powershell !mgmt_net

    # AD FS: block WS-Trust Windows-transport endpoints from extranet - exposing
    # them lets attackers bypass extranet lockout and brute-force AD accounts.
    # (On AD FS itself: Set-AdfsEndpoint ... -Proxy $false, not Disable-AdfsEndpoint.)
    acl adfs_wstrust_win path_beg -i /adfs/services/trust/2005/windowstransport /adfs/services/trust/13/windowstransport
    http-request deny deny_status 403 if h_sts adfs_wstrust_win

    # Keycloak: admin console only from trusted nets; never proxy health/metrics.
    acl kc_admin path_beg -i /admin
    acl kc_mgmt  path_beg -i /health /metrics
    http-request deny deny_status 403 if h_kc kc_admin !trust_net
    http-request deny deny_status 403 if h_kc kc_mgmt

    # Routing (all http-request denies above run before backend switching).
    use_backend be_adfs     if h_sts
    use_backend be_kc       if h_kc
    use_backend be_exchange if h_exch
    default_backend be_tarpit

# =============================================================================
# Backends. SSL bridging: re-encrypt with SNI (http.sys on AD FS/Exchange needs
# SNI or answers HTTP 400 "Invalid Hostname").
# For HA, add more `server` lines with the same check settings.
# =============================================================================
backend be_exchange
    option httpchk
    http-check send meth GET uri /owa/healthcheck.htm
    http-check expect status 200
    option log-health-checks
    server exch 10.0.0.20:443 ssl verify none sni str(mail.corp.example) check check-sni mail.corp.example inter 5s downinter 2s fall 3 rise 2

backend be_adfs
    # /adfs/probe is the supported LB probe (IdpInitiatedSignon should be disabled).
    option httpchk
    http-check send meth GET uri /adfs/probe ver HTTP/1.1 hdr Host sts.corp.example
    http-check expect status 200
    server adfs 10.0.0.10:443 ssl verify none sni str(sts.corp.example) check check-sni sts.corp.example inter 5s downinter 2s fall 3 rise 2

backend be_kc
    http-request set-header X-Forwarded-Host kc.corp.example
    # Quarkus serves /health on the mgmt port; probe a stable public endpoint.
    option httpchk
    http-check send meth GET uri /realms/master/.well-known/openid-configuration ver HTTP/1.1 hdr Host kc.corp.example
    http-check expect status 200
    server kc 10.0.0.10:8080 check inter 5s downinter 2s fall 3 rise 2

# Coraza WAF SPOA agent (Docker, 127.0.0.1:9001). Fail-open via set-on-error in
# coraza.cfg. Not 9000: that is the stats listener above.
backend coraza-spoa
    mode tcp
    option spop-check
    server coraza1 127.0.0.1:9001 check inter 5s fall 3 rise 2

# Tarpit: slow-drop unmatched / hostile requests instead of a fast 404.
backend be_tarpit
    timeout tarpit 5s
    http-request tarpit deny_status 403
