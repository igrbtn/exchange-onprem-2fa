[coraza]
# SPOE config that ties HAProxy to the Coraza SPOA agent.
# Only inspect the browser web surface (/owa /ecp); binary rich-client protocols are excluded.

[coraza.args]
messages = coraza-req coraza-res

[coraza.timeout]
hello      = 2s
idle       = 2m
processing = 500ms

# Fail-open: if the agent is down, allow the request rather than break mail flow.
option set-on-error = error

[spoe-message coraza-req]
args = app=str(owa) src-ip=src src-port=src_port method=method path=path query=query version=req.ver headers=req.hdrs body=req.body
event = on-frontend-http-request if { path_beg -i /owa /ecp }

[spoe-message coraza-res]
args = app=str(owa) version=res.ver status=status headers=res.hdrs body=res.body
event = on-http-response if { path_beg -i /owa /ecp }
