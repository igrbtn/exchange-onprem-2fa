# HAProxy SPOE engine config for the Coraza WAF agent.
# Referenced from haproxy.cfg:  filter spoe engine coraza config /etc/haproxy/coraza.cfg
# Vars are exposed to HAProxy under the txn.coraza.* prefix (var-prefix coraza).

[coraza]

spoe-agent coraza-agent
    messages         coraza-req coraza-res
    option           var-prefix    coraza
    # On agent error, fail OPEN (let traffic through) so a WAF outage does not
    # take mail offline. Set to fail closed only if policy requires it (then an
    # unreachable WAF blocks users).
    option           set-on-error  error
    timeout hello       2s
    timeout idle        2m
    timeout processing  500ms
    use-backend      coraza-spoa
    log              global

# Request phase: send method/path/query/headers/body to the WAF.
# SCOPED to /owa /ecp only: the frontend also carries binary rich-client
# protocols (MAPI/EWS/EAS) that would flood the WAF with false positives.
# NOTE (coraza-spoa 0.7.x): the app arg must come first.
spoe-message coraza-req
    args    app=str(owa_app) src-ip=src src-port=src_port dst-ip=dst dst-port=dst_port method=method path=path query=query version=req.ver headers=req.hdrs body=req.body
    event   on-frontend-http-request if { path_beg -i /owa /ecp }

# Response phase: inspect outbound headers/body (reflected XSS, data leaks).
# id=var(txn.coraza.id) is REQUIRED - the agent sets it while handling the
# request and uses it to correlate the response with the open transaction.
# Without it response_check silently fails.
spoe-message coraza-res
    args    app=str(owa_app) id=var(txn.coraza.id) version=res.ver status=status headers=res.hdrs body=res.body
    event   on-http-response if { path_beg -i /owa /ecp }
