# OWA-specific CRS false-positive exclusions.
# Populate this AFTER running DetectionOnly against real OWA traffic and reading
# the WAF log for the rule IDs that trip on legitimate requests. Use the reserved
# local range for your own rules/exclusions: IDs 100000-189999.
#
# Enable by uncommenting the Include line in coraza-spoa.yaml:
#   Include /etc/coraza-spoa/rules/owa-exclusions.conf
#
# Examples (do NOT enable blindly - confirm each against your own logs first):
#
# Drop a specific rule that OWA trips on a body field:
# SecRuleRemoveById 942100
#
# Exclude a target from one rule instead of removing it entirely:
# SecRuleUpdateTargetById 920273 "!ARGS:Body"
#
# Scope an exclusion to a path (OWA only):
# SecRule REQUEST_URI "@beginsWith /owa/" \
#   "id:100001,phase:1,pass,nolog,ctl:ruleRemoveById=942100"
